[project]
name = "salvo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "ortools>=9.15.6755",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# ortools' swig bindings trip a python deprecation warning on import, not ours
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

# cpu-only torch on linux, otherwise ci pulls gigabytes of cuda it never uses
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
